{% if post.video_url %}{% if youtube_connected %}<form class="youtube-publish" method="post" action="{% url 'youtube_publish' %}">{% csrf_token %}<input type="hidden" name="video_url" value="{{ post.video_url }}"><input type="hidden" name="return_to" value="{{ return_to }}"><label class="yt-field">YouTube title<input name="title" maxlength="100" value="{{ post.caption|truncatechars:100 }}" placeholder="Video title"></label><details class="yt-details"><summary>Description and visibility</summary><textarea name="description" maxlength="5000" rows="3" placeholder="Optional description">{{ post.caption }}</textarea><select name="privacy_status" aria-label="YouTube visibility"><option value="public" selected>Published (Public)</option><option value="unlisted">Unlisted</option><option value="private">Private</option></select></details><label class="yt-rights"><input type="checkbox" name="rights_confirmed" required><span>I own this video or have permission to publish it on YouTube.</span></label><button class="yt-publish-button" type="submit">Publish to YouTube <span>↗</span></button></form>{% else %}<a class="connect-youtube" href="{% url 'youtube_connect' %}?next={{ return_to|urlencode }}">Connect YouTube to publish</a>{% endif %}{% endif %}
